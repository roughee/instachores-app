    <title>HomeCrew</title>
    <script>
      // Applies the stored theme preference before the bundle loads, so the
      // first paint is never wrong (no light-then-dark flash). Mirrors
      // src/composables/useTheme.ts readPrefs + applyTheme, kept deliberately
      // dependency-free since it must run synchronously, inline, before Zod
      // or Vue are available. `system` (the default) sets nothing, letting
      // the `prefers-color-scheme` media query in tokens.css take over.
      ;(function () {
        try {
          var raw = localStorage.getItem('homecrew.prefs')
          if (!raw) return
          var prefs = JSON.parse(raw)
          if (prefs && (prefs.theme === 'light' || prefs.theme === 'dark')) {
            document.documentElement.setAttribute('data-theme', prefs.theme)
          }
        } catch (e) {
          // Corrupt or inaccessible storage: fall through to the system theme.
        }
      })()
    </script>
